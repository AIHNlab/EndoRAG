[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "endorag"
version = "0.1.0"
description = "Agentic retrieval-augmented generation for endocrinology question answering"
readme = "README.md"
requires-python = ">=3.10,<3.11"
license = {text = "Apache-2.0"}
authors = [
  {name = "Maria Panagiotou"},
  {name = "Lubnaa Abdur Rahman"},
  {name = "Ioannis Papathanail"},
  {name = "Stavroula Mougiakakou"},
]

[project.scripts]
endorag = "endorag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
